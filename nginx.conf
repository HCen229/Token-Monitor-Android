# ==============================================================================
# Token Monitor - 宝塔面板 Nginx 反向代理与 SSL 配置文件
# ==============================================================================
# 使用说明：
# 方式一（推荐，在宝塔可视化界面操作）：
#   进入宝塔 ->「网站」-> 找到你的域名 -> 点击「设置」->「反向代理」->「添加反向代理」：
#   - 代理名称：token-hub
#   - 目标 URL：http://127.0.0.1:3000
#   - 发送域名：$host
#   然后进入该反向代理的「配置文件」，追加开启 SSE 推流支持（防止实时数据被缓存）：
#   proxy_buffering off;
#   proxy_cache off;
#
# 方式二（直接覆盖站点 Nginx 配置文件）：
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name your-domain.com; # 替换成你的实际域名

    # SSL 证书配置（宝塔开启 SSL 后会自动填入，保持宝塔原有路径即可）
    # ssl_certificate    /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    # ssl_prefer_server_ciphers on;

    # HTTP 自动强制跳转到 HTTPS
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # 反向代理到 Token Monitor Mobile Hub 服务 (默认端口 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 与持久连接支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 核心设置：支持 SSE 实时推流（关闭代理缓冲，保证电脑端数据实时推送到手机）
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 静态资源缓存策略
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Service Worker 和 HTML 不缓存
    location ~* (sw\.js|index\.html|manifest\.json)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log  /www/wwwlogs/your-domain.com.log;
    error_log  /www/wwwlogs/your-domain.com.error.log;
}
